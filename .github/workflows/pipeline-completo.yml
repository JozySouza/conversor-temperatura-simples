name: Pipeline completo com IA

on:
  workflow_dispatch:
    inputs:
      cenario:
        description: "Cenário de teste do deploy"
        type: choice
        options: [normal, com_falha, lentidao]
        default: normal

permissions:
  contents: read
  issues: write

# Modelo da Groq usado pelo scripts/ia_decisao.sh. Para trocar sem editar o arquivo,
# crie a variável GROQ_MODELO em Settings > Secrets and variables > Actions > Variables
env:
  MODELO: ${{ vars.GROQ_MODELO || 'llama-3.3-70b-versatile' }}

jobs:
  qualidade:                 # o quality gate das aulas anteriores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm ci

      - name: Linter
        run: npm run lint

      # Sem "|| true": teste quebrado ou cobertura < 80% param o pipeline
      - name: Testes com cobertura mínima de 80%
        run: npx jest --coverage --coverageThreshold='{"global":{"lines":80}}'

      - name: Quality Gate (cobertura, métricas, logs, traces)
        run: node qualidade/pipeline-qualidade.js ok

  seguranca:                 # SAST fixo + code review pela IA
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Trecho I: regras fixas. Olha só o código da aplicação (a pasta qualidade/
      # usa child_process de propósito, para rodar o Jest e o git nas aulas anteriores)
      - name: SAST simples (regras fixas)
        run: |
          CODIGO="converter.js server.js index.html"
          PERIGOSOS='eval\(|child_process|new Function|innerHTML|document\.write'
          SEGREDOS='(api_?key|senha|password|secret|token)[[:space:]]*[:=][[:space:]]*"[^"]{8,}"'
          if grep -nE "$PERIGOSOS" $CODIGO \
             || grep -niE "$SEGREDOS" $CODIGO; then
            echo "::error::SAST: padrão perigoso ou segredo no código"
            exit 1
          fi
          echo "SAST: nenhum padrão perigoso encontrado"

      # Trecho J: revisão de segurança pela IA
      - name: Separar o código para revisão
        run: |
          # O que mudou no último commit no código da aplicação
          git diff HEAD~1 -- converter.js server.js index.html > codigo_revisao.txt
          # Sem diff? Revisa os arquivos principais
          [ -s codigo_revisao.txt ] || cat converter.js server.js > codigo_revisao.txt

      - name: Code review de segurança pela IA
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
          TAREFA: >-
            Code review de segurança de um conversor de temperatura Celsius/Fahrenheit
            (página web + API em Node.js). Reprove se houver
            execução de comandos, injeção de SQL, segredos no código ou erro de lógica grave.
          ARQUIVO_DADOS: codigo_revisao.txt
          OPCOES: APROVAR REPROVAR
          OPCAO_SEGURA: REPROVAR
        run: |
          bash scripts/ia_decisao.sh
          if [ "$(cat ia_decisao.txt)" != "APROVAR" ]; then
            echo "::error::Revisão de segurança reprovou"
            exit 1
          fi

  aprovacao:                 # humano no loop
    needs: [qualidade, seguranca]
    runs-on: ubuntu-latest
    environment: producao    # o run PARA aqui até alguém aprovar
    steps:
      - run: echo "Deploy aprovado por ${{ github.actor }}"

  deploy:                    # deploy + canary + rollback (Tarefas 1 e 2)
    needs: aprovacao
    runs-on: ubuntu-latest
    env:
      LIMITE_ERRO_PCT: 5
      LIMITE_P99_MS: 800
    steps:
      # Histórico completo: precisamos do commit anterior
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ESTÁVEL = commit anterior (o que está "em produção")
      # NOVA    = código deste commit (o que queremos entregar)
      - name: Montar a versão estável em outra pasta
        run: git worktree add ../versao-estavel HEAD~1

      # server.js só usa módulos nativos do Node: não há dependências para instalar

      - name: Subir versão estável (porta 8001)
        working-directory: ../versao-estavel
        run: |
          setsid nohup env PORT=8001 node server.js > "$GITHUB_WORKSPACE/estavel.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/estavel.pid"

      # Trecho F: no cenário "lentidao" a versão nova recebe SIMULAR_LENTIDAO=1
      # e fica mais lenta a cada requisição
      - name: Subir versão nova (porta 8002)
        env:
          SIMULAR_LENTIDAO: ${{ inputs.cenario == 'lentidao' && '1' || '0' }}
        run: |
          setsid nohup env PORT=8002 node server.js > nova.log 2>&1 &
          echo $! > nova.pid

      - name: Esperar as duas versões responderem
        run: |
          for PORTA in 8001 8002; do
            for _ in $(seq 1 30); do
              curl -sf "http://127.0.0.1:$PORTA/health" > /dev/null && break
              sleep 1
            done
            curl -sf "http://127.0.0.1:$PORTA/health" > /dev/null \
              || { echo "::error::Porta $PORTA não respondeu"; cat ./*.log; exit 1; }
          done

      # Cenário de falha: derruba a versão nova (funciona em qualquer projeto)
      - name: Simular falha na versão nova
        if: inputs.cenario == 'com_falha'
        run: kill -- -"$(cat nova.pid)" || true

      # Trecho G: canary 10% -> 50% -> 100% com rollback imediato e preditivo
      - name: Canary com rollback imediato e preditivo
        id: canary
        env:
          GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
          IA_RESUMO: "0"   # a análise da IA entra na tabela abaixo
          URL_ESTAVEL: http://127.0.0.1:8001/api/converter?valor=25&direcao=c-para-f
          URL_NOVA: http://127.0.0.1:8002/api/converter?valor=25&direcao=c-para-f
        run: |
          echo "[]" > historico.json
          {
            echo "## 🐤 Canary"
            echo "| Etapa | Erro | p99 | Ação | Análise da IA |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for PCT in 10 50 100; do
            bash scripts/medir.sh "$URL_ESTAVEL" "$URL_NOVA" "$PCT" 200 etapa.json
            # O histórico acumulado é o que permite à IA enxergar TENDÊNCIA
            jq -s '.[0] + [.[1]]' historico.json etapa.json > h.tmp
            mv h.tmp historico.json
            ERRO=$(jq '.nova.taxa_erro_pct' etapa.json)
            P99=$(jq '.nova.latencia_p99_ms' etapa.json)

            # 1) ROLLBACK IMEDIATO: limite fixo estourado, sem consultar a IA
            RUIM=$(jq --argjson e "$LIMITE_ERRO_PCT" --argjson l "$LIMITE_P99_MS" \
              '.nova.taxa_erro_pct > $e or .nova.latencia_p99_ms > $l' etapa.json)
            if [ "$RUIM" = "true" ]; then
              echo "| $PCT% | $ERRO% | $P99 ms | ⛔ rollback imediato | não consultada |" \
                >> "$GITHUB_STEP_SUMMARY"
              { echo "rollback=true"
                echo "motivo=Limite fixo estourado com $PCT% do tráfego"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # 2) ROLLBACK PREDITIVO: a IA analisa a série de etapas
            JUST="—"
            if [ "$PCT" -lt 100 ]; then
              TAREFA="Canary release. Os dados são o histórico das etapas
                (pct_nova = % do tráfego na versão nova).
                Limites: erro <= ${LIMITE_ERRO_PCT}% e p99 <= ${LIMITE_P99_MS}ms.
                Se o erro ou a latência da versão nova estiverem subindo de forma
                consistente e se aproximando do limite, a ponto de estourá-lo nas
                próximas etapas, escolha ROLLBACK mesmo que o limite ainda não
                tenha sido atingido. Variações de poucos milissegundos longe do
                limite são ruído normal: nesse caso, ou se estiver estável,
                escolha CONTINUAR." \
              ARQUIVO_DADOS=historico.json OPCOES="CONTINUAR ROLLBACK" OPCAO_SEGURA=ROLLBACK \
                bash scripts/ia_decisao.sh
              JUST=$(cat ia_justificativa.txt)
              if [ "$(cat ia_decisao.txt)" != "CONTINUAR" ]; then
                echo "| $PCT% | $ERRO% | $P99 ms | ⚠️ rollback preditivo | $JUST |" \
                  >> "$GITHUB_STEP_SUMMARY"
                { echo "rollback=true"
                  echo "motivo=IA previu degradação com $PCT% do tráfego"; } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            echo "| $PCT% | $ERRO% | $P99 ms | ✅ avança | $JUST |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "rollback=false" >> "$GITHUB_OUTPUT"

      # Trecho H: rollback (devolve 100% do tráfego à estável e confere a saúde dela)
      - name: Executar rollback
        if: steps.canary.outputs.rollback == 'true'
        env:
          MOTIVO: ${{ steps.canary.outputs.motivo }}
        run: |
          bash scripts/medir.sh "http://127.0.0.1:8001/api/converter?valor=25&direcao=c-para-f" \
            "http://127.0.0.1:8002/api/converter?valor=25&direcao=c-para-f" 0 100 pos_rollback.json
          ERRO=$(jq '.estavel.taxa_erro_pct' pos_rollback.json)
          {
            echo "### ↩️ Rollback executado"
            echo "- Motivo: $MOTIVO"
            echo "- Versão estável após o rollback: erro de $ERRO%"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Rollback: $MOTIVO"
          exit 1

      - name: Versão nova em 100%
        if: steps.canary.outputs.rollback == 'false'
        run: |
          echo "## ✅ Canary concluído: versão nova com 100% do tráfego" >> "$GITHUB_STEP_SUMMARY"

      # Registra o incidente como issue (exige "permissions: issues: write")
      - name: Abrir issue do incidente
        if: failure() && steps.canary.outputs.rollback == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOTIVO: ${{ steps.canary.outputs.motivo }}
        run: |
          gh issue create --title "Rollback automático do deploy" \
            --body "Motivo: $MOTIVO. Detalhes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
